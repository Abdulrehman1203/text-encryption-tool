<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Encryption Tool</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="container">
    <header>
      <h1>🔐 Text Encryption Tool</h1>
      <p class="subtitle">Encrypt, decrypt, encode, and hash text using multiple algorithms</p>
    </header>

    <main class="card">

      <!-- Plaintext / Input -->
      <label for="inputText">Input Text</label>
      <textarea id="inputText" rows="4" placeholder="Type or paste your text here..."></textarea>

      <!-- Algorithm selection -->
      <div class="row">
        <div class="field">
          <label for="algorithm">Algorithm</label>
          <select id="algorithm">
            <option value="">-- Select an algorithm --</option>
            <optgroup label="Encryption">
              <option value="caesar">Caesar Cipher</option>
              <option value="vigenere">Vigenere Cipher</option>
              <option value="aes">AES</option>
              <option value="des">DES</option>
              <option value="des3">Triple DES (3DES)</option>
              <option value="rsa">RSA</option>
            </optgroup>
            <optgroup label="Encoding">
              <option value="base64">Base64</option>
              <option value="hex">Hexadecimal</option>
            </optgroup>
            <optgroup label="Hashing">
              <option value="md5">MD5</option>
              <option value="sha256">SHA-256</option>
            </optgroup>
          </select>
        </div>

        <div class="field" id="keyField" style="display:none;">
          <label for="keyInput" id="keyLabel">Key</label>
          <input type="text" id="keyInput" placeholder="Enter key">
        </div>
      </div>

      <!-- Info badge explaining what type of operation this is -->
      <div id="algoInfo" class="algo-info" style="display:none;"></div>

      <!-- Buttons -->
      <div class="button-row">
        <button id="encryptBtn" class="btn primary">Encrypt</button>
        <button id="decryptBtn" class="btn secondary">Decrypt</button>
        <button id="resetBtn" class="btn ghost">Reset</button>
      </div>

      <!-- Error message -->
      <p id="errorMsg" class="error-msg"></p>

      <!-- Output -->
      <label for="outputText">Result</label>
      <textarea id="outputText" rows="4" readonly placeholder="Output will appear here..."></textarea>

      <div class="button-row">
        <button id="copyBtn" class="btn outline">📋 Copy Result</button>
        <span id="copyConfirm" class="copy-confirm"></span>
      </div>

    </main>

    <footer>
      <p>Information Security Assignment 2 &mdash; Web-Based Text Encryption Tool</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
